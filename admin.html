<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Video Gallery Management</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Kanit', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .admin-container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            overflow: hidden;
        }

        .admin-header {
            background: linear-gradient(135deg, #2c3e50 0%, #3498db 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .admin-header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .admin-header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .admin-content {
            padding: 30px;
        }

        .form-section {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 25px;
            margin-bottom: 30px;
            border-left: 5px solid #3498db;
        }

        .form-section h2 {
            color: #2c3e50;
            margin-bottom: 20px;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-weight: 500;
            color: #2c3e50;
            margin-bottom: 8px;
            font-size: 1rem;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            padding: 12px;
            border: 2px solid #e0e6ed;
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.3s ease;
            font-family: 'Kanit', sans-serif;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #3498db;
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.1);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Kanit', sans-serif;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #3498db 0%, #2980b9 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(52, 152, 219, 0.4);
        }

        .btn-success {
            background: linear-gradient(135deg, #27ae60 0%, #229954 100%);
            color: white;
        }

        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(39, 174, 96, 0.4);
        }

        .btn-danger {
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
            color: white;
        }

        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(231, 76, 60, 0.4);
        }

        .video-list {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 25px;
            border-left: 5px solid #27ae60;
        }

        .video-item {
            background: white;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 15px;
            border: 1px solid #e0e6ed;
            transition: all 0.3s ease;
        }

        .video-item:hover {
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transform: translateY(-2px);
        }

        .video-item-header {
            display: flex;
            justify-content: between;
            align-items: flex-start;
            gap: 20px;
            margin-bottom: 15px;
        }

        .video-info {
            flex-grow: 1;
        }

        .video-title {
            color: #2c3e50;
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .video-category {
            display: inline-block;
            background: #3498db;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 500;
        }

        .video-description {
            color: #666;
            margin: 10px 0;
            line-height: 1.5;
        }

        .video-student {
            color: #7f8c8d;
            font-size: 0.9rem;
            font-style: italic;
        }

        .video-actions {
            display: flex;
            gap: 10px;
        }

        .video-preview {
            width: 120px;
            height: 80px;
            border-radius: 5px;
            object-fit: cover;
            border: 2px solid #e0e6ed;
        }

        .alert {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: 500;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .hidden {
            display: none;
        }

        .youtube-preview {
            width: 120px;
            height: 80px;
            border-radius: 5px;
            overflow: hidden;
        }

        .youtube-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        @media (max-width: 768px) {
            .admin-content {
                padding: 20px;
            }
            
            .form-grid {
                grid-template-columns: 1fr;
            }
            
            .video-item-header {
                flex-direction: column;
                align-items: stretch;
            }
            
            .video-actions {
                justify-content: center;
                margin-top: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="admin-container">
        <div class="admin-header">
            <h1>🎬 Video Gallery Admin Panel</h1>
            <p>จัดการคลังวิดีโอผลงานนักศึกษา สาขาเทคโนโลยีมัลติมีเดีย</p>
            <div style="margin-top: 15px;">
                <a href="index.html" target="_blank" style="background: rgba(255,255,255,0.2); color: white; padding: 10px 20px; border-radius: 20px; text-decoration: none; font-weight: 500;">
                    🏠 ดูหน้าเว็บหลัก
                </a>
            </div>
        </div>

        <div class="admin-content">
            <!-- Alert Messages -->
            <div id="alertContainer"></div>

            <!-- Add New Video Form -->
            <div class="form-section">
                <h2>
                    <span class="material-symbols-outlined">add_circle</span>
                    เพิ่มวิดีโอใหม่
                </h2>
                
                <form id="videoForm">
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="videoUrl">YouTube URL *</label>
                            <input type="url" id="videoUrl" name="videoUrl" required 
                                   placeholder="https://www.youtube.com/watch?v=...">
                        </div>
                        
                        <div class="form-group">
                            <label for="category">หมวดหมู่ *</label>
                            <select id="category" name="category" required>
                                <option value="">เลือกหมวดหมู่</option>
                                <option value="animation">แอนิเมชัน</option>
                                <option value="game">เกม</option>
                                <option value="web">เว็บไซต์</option>
                                <option value="video">วิดีโอ</option>
                                <option value="graphic">กราฟิก</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-grid">
                        <div class="form-group">
                            <label for="title">ชื่อโครงการ *</label>
                            <input type="text" id="title" name="title" required 
                                   placeholder='เช่น แอนิเมชัน 2D "เรื่องเล่าจากอดีต"'>
                        </div>
                        
                        <div class="form-group">
                            <label for="studentName">ชื่อนักศึกษา *</label>
                            <input type="text" id="studentName" name="studentName" required 
                                   placeholder="เช่น น.ส. สมใจ ใจดี">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="description">รายละเอียดโครงการ *</label>
                        <textarea id="description" name="description" required 
                                  placeholder="อธิบายโครงการโดยสังเขป..."></textarea>
                    </div>

                    <button type="submit" class="btn btn-primary">
                        <span class="material-symbols-outlined">save</span>
                        บันทึกวิดีโอ
                    </button>
                </form>
            </div>

            <!-- Video List -->
            <div class="video-list">
                <h2>
                    <span class="material-symbols-outlined">video_library</span>
                    รายการวิดีโอทั้งหมด
                </h2>
                <div id="videoListContainer">
                    <!-- Video items will be loaded here -->
                </div>
            </div>

            <!-- Generate Code Section -->
            <div class="form-section">
                <h2>
                    <span class="material-symbols-outlined">code</span>
                    สร้างโค้ด HTML
                </h2>
                <p style="margin-bottom: 20px; color: #666;">
                    กดปุ่มด้านล่างเพื่อสร้างโค้ด HTML ที่อัพเดทแล้ว แล้วคัดลอกไปแทนที่ในไฟล์ index.html
                </p>
                <button id="generateCode" class="btn btn-success">
                    <span class="material-symbols-outlined">refresh</span>
                    สร้างโค้ด HTML อัพเดท
                </button>
                <div id="generatedCode" class="hidden" style="margin-top: 20px;">
                    <textarea id="codeOutput" style="width: 100%; height: 300px; font-family: monospace; font-size: 12px; padding: 15px; border-radius: 8px; border: 2px solid #e0e6ed;"></textarea>
                    <button id="copyCode" class="btn btn-primary" style="margin-top: 10px;">
                        <span class="material-symbols-outlined">content_copy</span>
                        คัดลอกโค้ด
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- YouTube Error 153 Fix -->
    <script src="youtube-error-fix.js"></script>
    
    <!-- Admin Panel JavaScript -->
    <script src="admin-panel.js"></script>
    <script src="admin-debug.js"></script>
</body>
</html>
