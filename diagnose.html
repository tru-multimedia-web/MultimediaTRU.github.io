<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>ตรวจสอบปัญหา Video Grid</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #1a1a1a;
            color: white;
        }
        .status { 
            padding: 15px; 
            margin: 10px 0; 
            border-radius: 8px;
            background: #2a2a2a;
        }
        .success { color: #27ae60; }
        .error { color: #e74c3c; }
        .warning { color: #f39c12; }
        pre {
            background: #000;
            padding: 15px;
            border-radius: 4px;
            overflow-x: auto;
        }
        button {
            background: #3498db;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover { background: #2980b9; }
    </style>
</head>
<body>
    <h1>🔍 ตรวจสอบปัญหา Video Grid</h1>
    
    <button onclick="checkAll()">🔄 ตรวจสอบทั้งหมด</button>
    <button onclick="window.location.href='http://localhost:5500/index.html'">👀 ดูหน้าหลัก</button>
    <button onclick="window.location.href='http://localhost:5500/test-add-video.html'">➕ เพิ่มวิดีโอ</button>
    
    <div id="results"></div>

    <script>
        const STORAGE_KEY = 'multimedia_videos';
        
        function log(message, type = 'info') {
            const results = document.getElementById('results');
            const className = type === 'success' ? 'success' : type === 'error' ? 'error' : type === 'warning' ? 'warning' : '';
            results.innerHTML += `<div class="status ${className}">${message}</div>`;
            console.log(message);
        }

        function checkAll() {
            document.getElementById('results').innerHTML = '';
            
            log('🔍 เริ่มการตรวจสอบ...');
            
            // 1. Check localStorage
            log('\n📦 1. ตรวจสอบ localStorage:');
            const stored = localStorage.getItem(STORAGE_KEY);
            
            if (!stored) {
                log('❌ ไม่มีข้อมูลใน localStorage', 'error');
                log('💡 แนะนำ: ไปเพิ่มวิดีโอที่ <a href="test-add-video.html" style="color: #3498db;">หน้านี้</a>', 'warning');
                return;
            }
            
            let videos = [];
            try {
                videos = JSON.parse(stored);
                log(`✅ พบข้อมูล: ${videos.length} รายการ`, 'success');
            } catch (e) {
                log(`❌ Error parsing localStorage: ${e.message}`, 'error');
                return;
            }
            
            // 2. Check video format
            log('\n📁 2. ตรวจสอบรูปแบบข้อมูล:');
            const driveVideos = videos.filter(v => v.url && !v.videoUrl);
            const youtubeVideos = videos.filter(v => v.videoUrl || v.videoId);
            
            log(`📁 Google Drive: ${driveVideos.length} รายการ`, driveVideos.length > 0 ? 'success' : 'warning');
            log(`🎬 YouTube (เก่า): ${youtubeVideos.length} รายการ`, youtubeVideos.length > 0 ? 'warning' : 'success');
            
            if (driveVideos.length === 0) {
                log('⚠️ ไม่มีวิดีโอ Google Drive! หน้าหลักจะไม่แสดงอะไร', 'error');
                log('💡 แนะนำ: ลบข้อมูล YouTube เก่าออก และเพิ่มวิดีโอใหม่จาก Google Drive', 'warning');
            }
            
            // 3. Show sample data
            log('\n🎬 3. ตัวอย่างข้อมูล:');
            if (driveVideos.length > 0) {
                const sample = driveVideos[0];
                log('ตัวอย่างวิดีโอรายการแรก:', 'success');
                log(`<pre>${JSON.stringify(sample, null, 2)}</pre>`);
                
                // Check required fields
                log('\n🔍 4. ตรวจสอบ required fields:');
                const required = ['url', 'title', 'category', 'description', 'studentName'];
                let allGood = true;
                
                required.forEach(field => {
                    if (sample[field]) {
                        log(`✅ ${field}: "${sample[field]}"`, 'success');
                    } else {
                        log(`❌ ${field}: ขาดหาย!`, 'error');
                        allGood = false;
                    }
                });
                
                if (allGood) {
                    log('\n✅ ข้อมูลครบถ้วน พร้อมแสดงผล!', 'success');
                    log('💡 ถ้าหน้าหลักยังไม่แสดง ให้ทำ Hard Refresh (Cmd+Shift+R)', 'warning');
                } else {
                    log('\n❌ ข้อมูลไม่ครบถ้วน อาจแสดงผลไม่ถูกต้อง', 'error');
                }
            }
            
            // 5. Check script loading
            log('\n📜 5. ตรวจสอบ JavaScript:');
            fetch('http://localhost:5500/js/video-gallery.js')
                .then(response => {
                    if (response.ok) {
                        log('✅ js/video-gallery.js โหลดได้', 'success');
                        return response.text();
                    } else {
                        throw new Error('HTTP ' + response.status);
                    }
                })
                .then(content => {
                    if (content.includes('createVideoCard')) {
                        log('✅ พบฟังก์ชัน createVideoCard', 'success');
                    }
                    if (content.includes('multimedia_videos')) {
                        log('✅ พบการอ้างอิง localStorage key', 'success');
                    }
                })
                .catch(err => {
                    log(`❌ ไม่สามารถโหลด video-gallery.js: ${err.message}`, 'error');
                });
            
            // 6. Test rendering
            log('\n🎨 6. ทดสอบการ render:');
            if (driveVideos.length > 0) {
                const testDiv = document.createElement('div');
                testDiv.style.cssText = 'margin-top: 20px; padding: 20px; background: #2a2a2a; border-radius: 8px;';
                
                const video = driveVideos[0];
                const thumbnailUrl = video.url.replace("/view", "/preview");
                
                testDiv.innerHTML = `
                    <h3>ตัวอย่างการแสดงผล:</h3>
                    <div style="background: #1e1e1e; border-radius: 8px; overflow: hidden; max-width: 400px;">
                        <div style="position: relative; padding-bottom: 56.25%; height: 0;">
                            <iframe src="${thumbnailUrl}" 
                                    style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none;"
                                    frameborder="0" allowfullscreen></iframe>
                        </div>
                        <div style="padding: 15px;">
                            <h4 style="margin: 0 0 10px 0;">${video.title}</h4>
                            <p style="margin: 0 0 10px 0; color: #ccc;">${video.description}</p>
                            <p style="margin: 0; color: #e74c3c;">โดย: ${video.studentName}</p>
                        </div>
                    </div>
                `;
                
                document.body.appendChild(testDiv);
                log('✅ แสดงตัวอย่างการ render ด้านล่าง', 'success');
            }
        }
        
        // Auto check on load
        setTimeout(checkAll, 500);
    </script>
</body>
</html>
