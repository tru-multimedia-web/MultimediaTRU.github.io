<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ทดสอบ JSON Loading</title>
    <style>
        body {
            font-family: 'Kanit', Arial, sans-serif;
            background: #0f0f0f;
            color: white;
            padding: 40px;
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 { color: #ff0404; }
        pre {
            background: #1a1a1a;
            padding: 20px;
            border-radius: 8px;
            overflow-x: auto;
            border: 1px solid #333;
        }
        .status { 
            padding: 15px; 
            margin: 20px 0; 
            border-radius: 8px;
            border-left: 4px solid;
        }
        .success { background: #1a3a1a; border-color: #00ff00; }
        .error { background: #3a1a1a; border-color: #ff0404; }
        .info { background: #1a1a3a; border-color: #0099ff; }
        button {
            background: linear-gradient(135deg, #ff0404 0%, #cc0303 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            margin: 10px 5px;
        }
        button:hover { background: linear-gradient(135deg, #ff1a1a 0%, #ff0404 100%); }
        .video-preview {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .video-card {
            background: #1a1a1a;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #333;
        }
        .video-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 4px;
            background: #000;
        }
        .video-card h3 { color: #ff0404; margin: 10px 0; }
        .video-card p { color: #999; font-size: 14px; }
    </style>
</head>
<body>
    <h1>🔍 ทดสอบการโหลด videos.json</h1>
    
    <button onclick="testLoad()">🔄 ทดสอบโหลด JSON</button>
    <button onclick="testFetch()">📡 ทดสอบ Fetch API</button>
    <button onclick="location.href='index.html'">🏠 กลับหน้าหลัก</button>
    
    <div id="status"></div>
    <div id="result"></div>
    <div id="preview" class="video-preview"></div>

    <script>
        const statusDiv = document.getElementById('status');
        const resultDiv = document.getElementById('result');
        const previewDiv = document.getElementById('preview');

        async function testLoad() {
            statusDiv.innerHTML = '<div class="status info">กำลังโหลด...</div>';
            resultDiv.innerHTML = '';
            previewDiv.innerHTML = '';

            try {
                const response = await fetch('./js/videos.json');
                
                statusDiv.innerHTML = `
                    <div class="status ${response.ok ? 'success' : 'error'}">
                        <strong>HTTP Status:</strong> ${response.status} ${response.statusText}<br>
                        <strong>Content-Type:</strong> ${response.headers.get('content-type')}<br>
                        <strong>URL:</strong> ${response.url}
                    </div>
                `;

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const text = await response.text();
                console.log('Raw response:', text);

                const videos = JSON.parse(text);
                
                resultDiv.innerHTML = `
                    <div class="status success">
                        <strong>✅ โหลดสำเร็จ!</strong><br>
                        จำนวนวิดีโอ: ${videos.length}
                    </div>
                    <h3>📄 ข้อมูล JSON:</h3>
                    <pre>${JSON.stringify(videos, null, 2)}</pre>
                `;

                // แสดง preview
                videos.forEach(video => {
                    let thumbnailUrl = video.thumbnail || '';
                    if (thumbnailUrl.includes('drive.google.com/file/d/')) {
                        const fileIdMatch = thumbnailUrl.match(/\/d\/([^\/]+)/);
                        if (fileIdMatch) {
                            thumbnailUrl = `https://drive.google.com/uc?export=view&id=${fileIdMatch[1]}`;
                        }
                    }

                    const card = document.createElement('div');
                    card.className = 'video-card';
                    card.innerHTML = `
                        ${thumbnailUrl ? `<img src="${thumbnailUrl}" alt="${video.title}" onerror="this.src='https://via.placeholder.com/400x225/1a1a1a/ff0404?text=No+Image'">` : '<div style="height:200px;background:#000;display:flex;align-items:center;justify-content:center;">ไม่มีภาพปก</div>'}
                        <h3>${video.title}</h3>
                        <p>${video.description}</p>
                        <p style="color: #ff0404; font-size: 12px;">โดย: ${video.studentName}</p>
                        <p style="color: #666; font-size: 12px;">หมวดหมู่: ${video.category}</p>
                    `;
                    previewDiv.appendChild(card);
                });

            } catch (error) {
                statusDiv.innerHTML = `
                    <div class="status error">
                        <strong>❌ เกิดข้อผิดพลาด!</strong><br>
                        ${error.message}
                    </div>
                `;
                resultDiv.innerHTML = `<pre>Error: ${error.stack}</pre>`;
                console.error('Error:', error);
            }
        }

        async function testFetch() {
            statusDiv.innerHTML = '<div class="status info">ทดสอบ Fetch API...</div>';
            
            const tests = [
                './js/videos.json',
                'js/videos.json',
                '/js/videos.json'
            ];

            let html = '<h3>📡 ทดสอบ URL ต่างๆ:</h3>';
            
            for (const url of tests) {
                try {
                    const response = await fetch(url);
                    html += `<div class="status ${response.ok ? 'success' : 'error'}">
                        <strong>URL:</strong> ${url}<br>
                        <strong>Status:</strong> ${response.status} ${response.ok ? '✅' : '❌'}
                    </div>`;
                } catch (error) {
                    html += `<div class="status error">
                        <strong>URL:</strong> ${url}<br>
                        <strong>Error:</strong> ${error.message} ❌
                    </div>`;
                }
            }
            
            resultDiv.innerHTML = html;
        }

        // Auto test on load
        window.addEventListener('DOMContentLoaded', testLoad);
    </script>
</body>
</html>
