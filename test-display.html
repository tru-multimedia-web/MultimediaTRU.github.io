<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ทดสอบการแสดงวิดีโอ</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        body {
            background: #1a1a1a;
            color: white;
            padding: 20px;
        }
        .debug-info {
            background: #2a2a2a;
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
            font-family: monospace;
        }
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 30px;
            margin: 30px 0;
        }
        .success { color: #27ae60; }
        .error { color: #e74c3c; }
        .warning { color: #f39c12; }
    </style>
</head>
<body>
    <h1>🧪 ทดสอบการแสดงวิดีโอ</h1>
    
    <div class="debug-info">
        <h3>📊 ข้อมูล Debug:</h3>
        <div id="debug"></div>
    </div>

    <div class="video-grid" id="videoGrid"></div>

    <script>
        const STORAGE_KEY = 'multimedia_videos';
        const debugDiv = document.getElementById('debug');
        const videoGrid = document.getElementById('videoGrid');
        
        function log(message, type = 'info') {
            const color = type === 'success' ? 'success' : type === 'error' ? 'error' : type === 'warning' ? 'warning' : '';
            debugDiv.innerHTML += `<p class="${color}">${message}</p>`;
            console.log(message);
        }
        
        // Load videos
        log('🔍 กำลังโหลดข้อมูลจาก localStorage...');
        const stored = localStorage.getItem(STORAGE_KEY);
        
        if (!stored) {
            log('❌ ไม่พบข้อมูลใน localStorage', 'error');
        } else {
            try {
                const allVideos = JSON.parse(stored);
                log(`✅ โหลดข้อมูลสำเร็จ: ${allVideos.length} รายการ`, 'success');
                
                const driveVideos = allVideos.filter(v => v.url && !v.videoUrl);
                const youtubeVideos = allVideos.filter(v => v.videoUrl || v.videoId);
                
                log(`📁 Google Drive: ${driveVideos.length} รายการ`, driveVideos.length > 0 ? 'success' : 'warning');
                log(`🎬 YouTube (เก่า): ${youtubeVideos.length} รายการ`, youtubeVideos.length > 0 ? 'warning' : 'success');
                
                if (driveVideos.length === 0) {
                    log('⚠️ ไม่มีวิดีโอ Google Drive ในระบบ', 'warning');
                    log('💡 กรุณาเพิ่มวิดีโอที่ <a href="test-add-video.html" style="color: #3498db;">หน้านี้</a>');
                } else {
                    log('📹 กำลังสร้างการ์ดวิดีโอ...');
                    
                    driveVideos.forEach((video, index) => {
                        log(`\n--- วิดีโอ #${index + 1} ---`);
                        log(`Title: ${video.title}`);
                        log(`Category: ${video.category}`);
                        log(`URL: ${video.url}`);
                        log(`Student: ${video.studentName}`);
                        
                        // Create video card
                        const videoCard = document.createElement('a');
                        videoCard.href = 'player.html?videoIndex=' + index;
                        videoCard.className = 'video-item';
                        videoCard.dataset.category = video.category.toLowerCase();
                        
                        const thumbnailUrl = video.url.replace("/view", "/preview");
                        log(`Thumbnail URL: ${thumbnailUrl}`);
                        
                        videoCard.innerHTML = `
                            <div class="video-thumbnail">
                                <iframe src="${thumbnailUrl}" frameborder="0" scrolling="no" allowfullscreen></iframe>
                                <div class="video-overlay">
                                    <span class="play-icon">▶</span>
                                </div>
                            </div>
                            <div class="video-info">
                                <h5 class="video-card-title">${video.title}</h5>
                                <p class="video-card-category">${video.category}</p>
                            </div>
                        `;
                        
                        videoGrid.appendChild(videoCard);
                    });
                    
                    log(`\n✅ สร้างการ์ดวิดีโอเสร็จสิ้น: ${driveVideos.length} รายการ`, 'success');
                }
                
            } catch (e) {
                log(`❌ Error: ${e.message}`, 'error');
                console.error(e);
            }
        }
    </script>
</body>
</html>
