<!DOCTYPE html>
<html>
<head>
    <title>Test Video JSON Load</title>
</head>
<body>
    <h1>Testing videos.json load</h1>
    <div id="result"></div>
    <pre id="data"></pre>
    
    <script>
        async function testLoad() {
            try {
                console.log('Fetching data/videos.json...');
                const response = await fetch('data/videos.json');
                console.log('Response:', response);
                
                if (response.ok) {
                    const data = await response.json();
                    console.log('Data:', data);
                    
                    document.getElementById('result').innerHTML = 
                        `<h2 style="color: green;">✅ Success! Loaded ${data.length} videos</h2>`;
                    document.getElementById('data').textContent = JSON.stringify(data, null, 2);
                } else {
                    document.getElementById('result').innerHTML = 
                        `<h2 style="color: red;">❌ Error: ${response.status}</h2>`;
                }
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('result').innerHTML = 
                    `<h2 style="color: red;">❌ Error: ${error.message}</h2>`;
            }
        }
        
        testLoad();
    </script>
</body>
</html>
