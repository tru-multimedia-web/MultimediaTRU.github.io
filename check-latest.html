<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Check Latest Data</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        pre { background: #f4f4f4; padding: 15px; overflow-x: auto; }
        .video-item { border: 1px solid #ddd; padding: 10px; margin: 10px 0; }
    </style>
</head>
<body>
    <h1>ตรวจสอบข้อมูลล่าสุด</h1>
    <div id="result"></div>
    <script>
        const stored = localStorage.getItem('multimedia_videos');
        const resultDiv = document.getElementById('result');
        
        if (stored) {
            try {
                const videos = JSON.parse(stored);
                resultDiv.innerHTML = '<h2>✅ พบวิดีโอ ' + videos.length + ' รายการ</h2>';
                
                // Show last 3 videos
                resultDiv.innerHTML += '<h3>วิดีโอล่าสุด 3 รายการ:</h3>';
                videos.slice(-3).forEach((video, index) => {
                    const hasYouTube = video.videoUrl || video.videoId;
                    const hasDrive = video.url;
                    resultDiv.innerHTML += '<div class="video-item">' +
                        '<h4>' + (videos.length - 2 + index) + '. ' + video.title + '</h4>' +
                        '<p><strong>Category:</strong> ' + video.category + '</p>' +
                        '<p><strong>Format:</strong> ' + (hasYouTube ? '🎬 YouTube' : hasDrive ? '📁 Google Drive' : '❌ Unknown') + '</p>' +
                        '<pre>' + JSON.stringify(video, null, 2) + '</pre>' +
                        '</div>';
                });
            } catch (e) {
                resultDiv.innerHTML = '<h2>❌ Error: ' + e.message + '</h2>';
            }
        } else {
            resultDiv.innerHTML = '<h2>⚠️ ไม่มีข้อมูล</h2>';
        }
    </script>
</body>
</html>
