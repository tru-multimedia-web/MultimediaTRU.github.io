<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ทดสอบเพิ่มวิดีโอ</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Sarabun', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 {
            color: #667eea;
            margin-bottom: 30px;
            font-size: 2rem;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: #333;
        }
        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            font-family: inherit;
        }
        textarea {
            min-height: 100px;
            resize: vertical;
        }
        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            margin-top: 10px;
        }
        button:hover {
            background: #5568d3;
        }
        .success {
            background: #27ae60;
        }
        .success:hover {
            background: #229954;
        }
        .info {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #667eea;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            display: none;
        }
        .result.show {
            display: block;
        }
        .result.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .result.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        pre {
            background: #f4f4f4;
            padding: 15px;
            border-radius: 4px;
            overflow-x: auto;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎬 ทดสอบเพิ่มวิดีโอ Google Drive</h1>
        
        <div class="info">
            <strong>วิธีใช้งาน:</strong><br>
            1. ใส่ Google Drive URL (รูปแบบ: https://drive.google.com/file/d/xxxxx/view)<br>
            2. กรอกข้อมูลให้ครบ<br>
            3. กดปุ่มเพิ่มวิดีโอ<br>
            4. ระบบจะแสดงผลลัพธ์และข้อมูลที่บันทึก
        </div>

        <form id="testForm">
            <div class="form-group">
                <label>Google Drive URL *</label>
                <input type="text" id="videoUrl" placeholder="https://drive.google.com/file/d/xxxxx/view" required>
                <small style="color: #666;">ตัวอย่าง: https://drive.google.com/file/d/1abc123xyz/view</small>
            </div>

            <div class="form-group">
                <label>หมวดหมู่ *</label>
                <select id="category" required>
                    <option value="">-- เลือกหมวดหมู่ --</option>
                    <option value="animation">แอนิเมชัน</option>
                    <option value="game">เกม</option>
                    <option value="web">เว็บไซต์</option>
                    <option value="video">วิดีโอ</option>
                    <option value="graphic">กราฟิก</option>
                </select>
            </div>

            <div class="form-group">
                <label>ชื่อวิดีโอ *</label>
                <input type="text" id="title" placeholder="ชื่อผลงาน" required>
            </div>

            <div class="form-group">
                <label>รายละเอียด *</label>
                <textarea id="description" placeholder="คำอธิบายเกี่ยวกับผลงาน" required></textarea>
            </div>

            <div class="form-group">
                <label>ชื่อนักศึกษา *</label>
                <input type="text" id="studentName" placeholder="ชื่อ-นามสกุล นักศึกษา" required>
            </div>

            <button type="submit">➕ เพิ่มวิดีโอ</button>
            <button type="button" class="success" onclick="showCurrentData()">📋 ดูข้อมูลทั้งหมด</button>
        </form>

        <div id="result" class="result"></div>
    </div>

    <script>
        const STORAGE_KEY = 'multimedia_videos';

        // Get Google Drive file ID from URL
        function getGoogleDriveFileId(url) {
            const regExp = /drive\.google\.com\/file\/d\/([a-zA-Z0-9_-]+)/;
            const match = url.match(regExp);
            return match ? match[1] : null;
        }

        // Load videos
        function loadVideos() {
            const stored = localStorage.getItem(STORAGE_KEY);
            return stored ? JSON.parse(stored) : [];
        }

        // Save videos
        function saveVideos(videos) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(videos));
        }

        // Show result
        function showResult(message, type = 'success') {
            const resultDiv = document.getElementById('result');
            resultDiv.className = 'result show ' + type;
            resultDiv.innerHTML = message;
            setTimeout(() => {
                resultDiv.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }, 100);
        }

        // Show current data
        function showCurrentData() {
            const videos = loadVideos();
            const driveVideos = videos.filter(v => v.url);
            const youtubeVideos = videos.filter(v => !v.url);
            
            showResult(`
                <h3>📊 สรุปข้อมูลใน localStorage</h3>
                <p><strong>วิดีโอทั้งหมด:</strong> ${videos.length} รายการ</p>
                <p><strong>📁 Google Drive:</strong> ${driveVideos.length} รายการ</p>
                <p><strong>🎬 YouTube (เก่า):</strong> ${youtubeVideos.length} รายการ</p>
                <details style="margin-top: 15px;">
                    <summary style="cursor: pointer; font-weight: bold;">แสดงข้อมูลทั้งหมด</summary>
                    <pre>${JSON.stringify(videos, null, 2)}</pre>
                </details>
            `, 'success');
        }

        // Handle form submit
        document.getElementById('testForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const videoUrl = document.getElementById('videoUrl').value.trim();
            const fileId = getGoogleDriveFileId(videoUrl);
            
            if (!fileId) {
                showResult('❌ Google Drive URL ไม่ถูกต้อง กรุณาตรวจสอบอีกครั้ง<br>รูปแบบที่ถูกต้อง: https://drive.google.com/file/d/xxxxx/view', 'error');
                return;
            }
            
            const videos = loadVideos();
            
            // Check duplicate
            if (videos.find(v => v.url === videoUrl)) {
                showResult('⚠️ วิดีโอนี้มีอยู่ในระบบแล้ว', 'error');
                return;
            }
            
            const newVideo = {
                id: Date.now().toString(),
                url: videoUrl,
                category: document.getElementById('category').value,
                title: document.getElementById('title').value.trim(),
                description: document.getElementById('description').value.trim(),
                studentName: document.getElementById('studentName').value.trim(),
                createdAt: new Date().toISOString()
            };
            
            videos.push(newVideo);
            saveVideos(videos);
            
            showResult(`
                <h3>✅ เพิ่มวิดีโอสำเร็จ!</h3>
                <p><strong>ชื่อ:</strong> ${newVideo.title}</p>
                <p><strong>หมวดหมู่:</strong> ${newVideo.category}</p>
                <p><strong>File ID:</strong> ${fileId}</p>
                <p><strong>จำนวนวิดีโอทั้งหมด:</strong> ${videos.length} รายการ</p>
                <details style="margin-top: 15px;">
                    <summary style="cursor: pointer; font-weight: bold;">ดูข้อมูลที่บันทึก</summary>
                    <pre>${JSON.stringify(newVideo, null, 2)}</pre>
                </details>
            `, 'success');
            
            // Reset form
            this.reset();
            
            console.log('✅ Added video:', newVideo);
        });
    </script>
</body>
</html>
