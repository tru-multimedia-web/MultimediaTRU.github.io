<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ทดสอบระบบ API - Video Gallery</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 32px;
        }
        
        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }
        
        .test-section {
            margin: 30px 0;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
            border-left: 4px solid #667eea;
        }
        
        .test-section h2 {
            color: #667eea;
            font-size: 20px;
            margin-bottom: 15px;
        }
        
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            margin: 5px;
            transition: transform 0.2s;
        }
        
        button:hover {
            transform: translateY(-2px);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        .result {
            margin-top: 15px;
            padding: 15px;
            background: white;
            border-radius: 8px;
            font-family: monospace;
            font-size: 14px;
            max-height: 300px;
            overflow-y: auto;
        }
        
        .success {
            color: #28a745;
            font-weight: bold;
        }
        
        .error {
            color: #dc3545;
            font-weight: bold;
        }
        
        .status {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 12px;
            font-weight: bold;
            margin: 5px 0;
        }
        
        .status.online {
            background: #d4edda;
            color: #155724;
        }
        
        .status.offline {
            background: #f8d7da;
            color: #721c24;
        }
        
        pre {
            background: #f4f4f4;
            padding: 10px;
            border-radius: 5px;
            overflow-x: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧪 ทดสอบระบบ API</h1>
        <p class="subtitle">Video Gallery Management System</p>
        
        <!-- Server Status -->
        <div class="test-section">
            <h2>1. ตรวจสอบสถานะ Server</h2>
            <button onclick="checkHealth()">ตรวจสอบ Server</button>
            <div id="healthResult" class="result"></div>
        </div>
        
        <!-- Get All Videos -->
        <div class="test-section">
            <h2>2. ดึงข้อมูลวิดีโอทั้งหมด</h2>
            <button onclick="getAllVideos()">GET /api/videos</button>
            <div id="getResult" class="result"></div>
        </div>
        
        <!-- Add Test Video -->
        <div class="test-section">
            <h2>3. เพิ่มวิดีโอทดสอบ</h2>
            <button onclick="addTestVideo()">เพิ่มวิดีโอ 1 รายการ</button>
            <button onclick="addMultipleVideos()">เพิ่มวิดีโอ 3 รายการ</button>
            <div id="addResult" class="result"></div>
        </div>
        
        <!-- Clear All Data -->
        <div class="test-section">
            <h2>4. ล้างข้อมูลทั้งหมด</h2>
            <button onclick="clearAllData()">ลบข้อมูลทั้งหมด</button>
            <div id="clearResult" class="result"></div>
        </div>
        
        <!-- Links -->
        <div class="test-section" style="border-left-color: #28a745;">
            <h2>🔗 ลิงค์ที่เกี่ยวข้อง</h2>
            <button onclick="window.open('index.html', '_blank')">หน้าหลัก</button>
            <button onclick="window.open('admin/', '_blank')">Admin Panel</button>
            <button onclick="window.open('http://localhost:3000/api/videos', '_blank')">API Endpoint</button>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:3000/api/videos';
        const HEALTH_URL = 'http://localhost:3000/api/health';
        
        async function checkHealth() {
            const result = document.getElementById('healthResult');
            result.innerHTML = 'กำลังตรวจสอบ...';
            
            try {
                const response = await fetch(HEALTH_URL);
                const data = await response.json();
                
                result.innerHTML = `
                    <span class="status online">✅ Server ทำงานปกติ</span><br>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                `;
            } catch (error) {
                result.innerHTML = `
                    <span class="status offline">❌ Server ไม่ทำงาน</span><br>
                    <span class="error">Error: ${error.message}</span><br>
                    <p style="margin-top: 10px;">กรุณาเปิด Server ด้วยคำสั่ง: <code>npm start</code></p>
                `;
            }
        }
        
        async function getAllVideos() {
            const result = document.getElementById('getResult');
            result.innerHTML = 'กำลังดึงข้อมูล...';
            
            try {
                const response = await fetch(API_URL);
                const videos = await response.json();
                
                result.innerHTML = `
                    <span class="success">✅ ดึงข้อมูลสำเร็จ</span><br>
                    <p>จำนวนวิดีโอทั้งหมด: <strong>${videos.length}</strong> รายการ</p>
                    <pre>${JSON.stringify(videos, null, 2)}</pre>
                `;
            } catch (error) {
                result.innerHTML = `<span class="error">❌ Error: ${error.message}</span>`;
            }
        }
        
        async function addTestVideo() {
            const result = document.getElementById('addResult');
            result.innerHTML = 'กำลังเพิ่มข้อมูล...';
            
            const testVideo = {
                id: Date.now().toString(),
                url: 'https://drive.google.com/file/d/1234567890/view',
                category: 'animation',
                title: 'วิดีโอทดสอบระบบ',
                description: 'นี่คือวิดีโอสำหรับทดสอบระบบ API',
                studentName: 'ผู้ทดสอบ',
                createdAt: new Date().toISOString()
            };
            
            try {
                // Get existing videos
                const getResponse = await fetch(API_URL);
                const videos = await getResponse.json();
                
                // Add new video
                videos.push(testVideo);
                
                // Save
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(videos)
                });
                
                const data = await response.json();
                
                result.innerHTML = `
                    <span class="success">✅ เพิ่มวิดีโอสำเร็จ!</span><br>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                    <p style="margin-top: 10px;">กด "GET /api/videos" เพื่อดูข้อมูลที่เพิ่ม</p>
                `;
            } catch (error) {
                result.innerHTML = `<span class="error">❌ Error: ${error.message}</span>`;
            }
        }
        
        async function addMultipleVideos() {
            const result = document.getElementById('addResult');
            result.innerHTML = 'กำลังเพิ่มข้อมูล...';
            
            const testVideos = [
                {
                    id: Date.now().toString() + '_1',
                    url: 'https://drive.google.com/file/d/TEST001/view',
                    category: 'animation',
                    title: 'Animation Project 2024',
                    description: '2D Animation ผลงานนักศึกษาชั้นปีที่ 3',
                    studentName: 'สมชาย ใจดี',
                    createdAt: new Date().toISOString()
                },
                {
                    id: Date.now().toString() + '_2',
                    url: 'https://drive.google.com/file/d/TEST002/view',
                    category: 'game',
                    title: 'Unity Game Development',
                    description: 'เกม 3D ผจญภัย',
                    studentName: 'สมหญิง รักเรียน',
                    createdAt: new Date().toISOString()
                },
                {
                    id: Date.now().toString() + '_3',
                    url: 'https://drive.google.com/file/d/TEST003/view',
                    category: 'video',
                    title: 'วิดีโอสารคดี',
                    description: 'สารคดีเกี่ยวกับวัฒนธรรมท้องถิ่น',
                    studentName: 'สมศรี สดใส',
                    createdAt: new Date().toISOString()
                }
            ];
            
            try {
                // Get existing videos
                const getResponse = await fetch(API_URL);
                const videos = await getResponse.json();
                
                // Add new videos
                testVideos.forEach(v => videos.push(v));
                
                // Save
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(videos)
                });
                
                const data = await response.json();
                
                result.innerHTML = `
                    <span class="success">✅ เพิ่ม 3 วิดีโอสำเร็จ!</span><br>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                    <p style="margin-top: 10px;">กด "GET /api/videos" เพื่อดูข้อมูลที่เพิ่ม</p>
                `;
            } catch (error) {
                result.innerHTML = `<span class="error">❌ Error: ${error.message}</span>`;
            }
        }
        
        async function clearAllData() {
            if (!confirm('คุณแน่ใจหรือไม่ว่าต้องการลบข้อมูลทั้งหมด?')) {
                return;
            }
            
            const result = document.getElementById('clearResult');
            result.innerHTML = 'กำลังลบข้อมูล...';
            
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify([])
                });
                
                const data = await response.json();
                
                result.innerHTML = `
                    <span class="success">✅ ลบข้อมูลทั้งหมดเรียบร้อย</span><br>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                `;
            } catch (error) {
                result.innerHTML = `<span class="error">❌ Error: ${error.message}</span>`;
            }
        }
        
        // Auto check health on load
        window.addEventListener('DOMContentLoaded', checkHealth);
    </script>
</body>
</html>
